'use strict';const $=s=>document.querySelector(s),apps=[['dot','🤖','Dot Bot'],['files','📁','Files'],['drive','💾','C: Drive'],['helper','🟣','Helper'],['notes','📝','Notepad'],['paint','🎨','Paint'],['beat','🥁','Pocket Beat'],['about','💻','About']];const windows=new Map();let topZ=20,untitled=1,activeNote=null;const KEY='boxsignal-os-files-v1';let files={};try{files=JSON.parse(localStorage.getItem(KEY)||'{}');if(!files||typeof files!=='object'||Array.isArray(files))files={}}catch{files={}}const saveFiles=()=>{try{localStorage.setItem(KEY,JSON.stringify(files));return true}catch{alert('Browser storage is full or unavailable. Export your document to keep it.');return false}};function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iconButton(id,emoji,name){let b=document.createElement('button');b.className='shortcut';b.innerHTML=`<span class="emoji">${emoji}</span><span>${name}</span>`;b.onclick=()=>launch(id);return b}apps.forEach(([id,emoji,name])=>{$('#desktop').append(iconButton(id,emoji,name));let b=document.createElement('button');b.textContent=emoji+'  '+name;b.onclick=()=>{launch(id);toggleMenu(false)};$('#menuitems').append(b)});function toggleMenu(force){const open=force??$('#menu').classList.contains('hidden');$('#menu').classList.toggle('hidden',!open);$('#start').setAttribute('aria-expanded',String(open))}$('#start').onclick=()=>toggleMenu();document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false)});document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#start'))toggleMenu(false)});function clock(){let d=new Date();$('#clock').innerHTML=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}clock();setInterval(clock,30000);

function launch(id){if(id==='dot'||id==='beat'){let title=id==='dot'?'Dot Bot':'Pocket Beat',url=id==='dot'?'https://getdotbot.uk/':'https://boxsignal.uk/pocket-beat.html';let el=makeWin(id,title);if(!el)return;el.classList.add('framecontent');let iframe=document.createElement('iframe');iframe.className='appframe';iframe.title=title;iframe.src=url;iframe.setAttribute('allow','microphone; clipboard-write');el.append(iframe);let bar=document.createElement('div');bar.style.cssText='padding:5px 10px;background:#dfe9f6;font-size:12px';bar.innerHTML=`If the app doesn't appear, <a href="${url}" target="_blank" rel="noopener noreferrer">open ${title} in a new tab</a>.`;el.prepend(bar);return}if(id==='drive')return drive();if(id==='helper')return helper();if(id==='notes')return notes();if(id==='files')return explorer();if(id==='paint')return paint();if(id==='about'){let el=makeWin(id,'About Box Signal OS');if(el)el.innerHTML='<div class="intro"><h2>◈ Box Signal OS</h2><p>A playful, browser-based desktop made for Box Signal. Launch Dot Bot, Pocket Beat, Notepad, Paint and your saved documents.</p><p><strong>Version 0.2</strong> · Built with HTML, CSS and JavaScript.</p><p>This is not Microsoft Windows and cannot run Windows .exe installers. The C: drive is virtual and stored in this browser only. Export anything important. Embedded external apps require a connection and may refuse to load in an iframe.</p><p><a href="https://boxsignal.uk" target="_blank" rel="noopener">Visit Box Signal</a></p></div>'}}
function notes(name){const el=makeWin('notes','Notepad');if(!el){if(name!==undefined)loadNote(name);return}el.innerHTML='<div class="toolbar"><button id="newnote">New</button><button id="savenote">Save</button><button id="exportnote">Download .txt</button><button id="openfiles">Open files</button><span id="notename" style="align-self:center;font-size:12px;color:#53667d">Untitled</span></div><textarea class="editor" id="note" spellcheck="true" placeholder="Start writing..."></textarea>';$('#newnote').onclick=()=>{activeNote=null;$('#note').value='';$('#notename').textContent='Untitled'};$('#savenote').onclick=()=>{let name=activeNote||prompt('Document name:',`Document ${untitled++}.txt`);if(!name)return;name=name.trim().slice(0,100);if(!name)return;files[name]=$('#note').value;if(saveFiles()){activeNote=name;$('#notename').textContent=name;refreshFiles()}};$('#exportnote').onclick=()=>download(new Blob([$('#note').value],{type:'text/plain;charset=utf-8'}),activeNote||'BoxSignalNote.txt');$('#openfiles').onclick=()=>explorer();if(name!==undefined)loadNote(name)}function loadNote(name){if(!windows.has('notes'))notes();activeNote=name;$('#note').value=files[name]||'';$('#notename').textContent=name;focusWin(windows.get('notes').w)}function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function explorer(){let el=makeWin('files','Files');if(!el)return;el.innerHTML='<div class="toolbar"><button id="newfile">New document</button><button id="importfile">Import .txt</button><input id="fileinput" type="file" accept=".txt,text/plain" hidden></div><div id="filelist"></div><p style="font-size:12px;color:#56677f">Documents are saved in this browser on this device. Export important files before clearing browser data.</p>';$('#newfile').onclick=()=>{notes();$('#newnote').click()};$('#importfile').onclick=()=>$('#fileinput').click();$('#fileinput').onchange=async e=>{let f=e.target.files[0];if(!f)return;files[f.name]=await f.text();saveFiles();refreshFiles();e.target.value=''};refreshFiles()}function refreshFiles(){let list=$('#filelist');if(!list)return;list.replaceChildren();let names=Object.keys(files).sort();if(!names.length){list.innerHTML='<p class="empty">No documents yet. Create one in Notepad.</p>';return}for(let name of names){let row=document.createElement('div');row.className='file';let title=document.createElement('strong');title.textContent='📄 '+name;row.append(title);let actions=document.createElement('div');actions.className='actions';for(let [label,fn] of [['Open',()=>loadNote(name)],['Export',()=>download(new Blob([files[name]],{type:'text/plain'}),name)],['Delete',()=>{if(confirm('Delete '+name+'?')){delete files[name];saveFiles();refreshFiles()}}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}row.append(actions);list.append(row)}}
function paint(){let el=makeWin('paint','Paint');if(!el)return;el.innerHTML='<div class="painttools"><label>Colour <input id="ink" type="color" value="#3e45be"></label><label>Brush <input id="brush" type="range" min="2" max="40" value="7"></label><button id="clearpaint">Clear</button><button id="savepaint">Save PNG</button></div><canvas id="paintcanvas" class="paint" width="900" height="520" aria-label="Drawing area"></canvas>';let c=$('#paintcanvas'),ctx=c.getContext('2d'),pointerId=null;c.style.touchAction='none';c.style.userSelect='none';c.style.webkitUserSelect='none';c.style.webkitUserDrag='none';c.setAttribute('draggable','false');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function stop(e){if(pointerId!==e.pointerId)return;e.preventDefault();pointerId=null;try{if(c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId)}catch{}}c.addEventListener('pointerdown',e=>{if(pointerId!==null||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();e.stopPropagation();pointerId=e.pointerId;c.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.strokeStyle=$('#ink').value;ctx.lineWidth=Number($('#brush').value);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()});c.addEventListener('pointermove',e=>{if(pointerId!==e.pointerId)return;e.preventDefault();let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);c.addEventListener('lostpointercapture',e=>{if(pointerId===e.pointerId)pointerId=null});c.addEventListener('dragstart',e=>e.preventDefault());c.addEventListener('selectstart',e=>e.preventDefault());$('#clearpaint').onclick=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)};$('#savepaint').onclick=()=>c.toBlob(b=>{if(b)download(b,'BoxSignalPainting.png')})}

// BOX SIGNAL OS v0.2: browser-local virtual drive (IndexedDB) and rule-based helper.
const DBNAME='boxsignal-os-drive-v1';let dbPromise;
function getDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{let req=indexedDB.open(DBNAME,1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains('entries'))db.createObjectStore('entries',{keyPath:'path'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}

async function putEntry(entry){return transact('readwrite',s=>s.put(entry))}
async function removeEntry(path){return transact('readwrite',s=>s.delete(path))}
const ROOT='C:';let cwd=ROOT;
async function initDrive(){let all=await allEntries();if(!all.length){await putEntry({path:ROOT,kind:'folder'});for(let name of ['Documents','Pictures','Downloads','Music'])await putEntry({path:ROOT+'/'+name,kind:'folder'})}}
function cleanName(name){name=String(name||'').trim().replace(/[\\/:*?"<>|\x00-\x1f]/g,'_');return name.slice(0,100)}

async function drive(){let el=makeWin('drive','💾 C: Drive');if(!el){await renderDrive();return}el.innerHTML='<div class="drivebar"><button id="driveup">⬆ Up</button><div class="drivepath" id="drivepath">C:</div><button id="drivefolder">+ Folder</button><button id="drivetext">+ Text</button><button id="driveimport">⬇ Import</button><input type="file" id="driveinput" multiple hidden></div><div id="driveitems" class="drivegrid"></div><p style="font-size:12px;color:#5b6980">Virtual drive: files live in this browser on this device. Export important files; clearing site data may erase them. Storage is limited by your browser.</p>';$('#driveup').onclick=()=>{cwd=parentPath(cwd);renderDrive()};$('#drivefolder').onclick=async()=>{let name=cleanName(prompt('New folder name:','New Folder'));if(!name)return;let path=pathJoin(cwd,name);if((await allEntries()).some(e=>e.path===path)){alert('That name already exists.');return}await putEntry({path,kind:'folder'});renderDrive()};$('#drivetext').onclick=async()=>{let name=cleanName(prompt('New text file:','New Document.txt'));if(!name)return;let path=pathJoin(cwd,name);if((await allEntries()).some(e=>e.path===path)){alert('That name already exists.');return}await putEntry({path,kind:'file',name,type:'text/plain',data:new Blob([''],{type:'text/plain'})});renderDrive()};$('#driveimport').onclick=()=>$('#driveinput').click();$('#driveinput').onchange=async e=>{let imported=0;for(let file of e.target.files){let name=cleanName(file.name),path=pathJoin(cwd,name);try{await putEntry({path,kind:'file',name,type:file.type||'application/octet-stream',data:file,lastModified:Date.now()});imported++}catch(err){alert('Could not save '+name+': '+err.message);break}}e.target.value='';await renderDrive();if(imported)notify('Imported '+imported+' file(s)')};try{await initDrive();await renderDrive()}catch(err){$('#driveitems').textContent='Drive unavailable: '+err.message}}
async function renderDrive(){let holder=$('#driveitems');if(!holder)return;$('#drivepath').textContent=cwd.replaceAll('/',' \\ ');let entries=await allEntries(),children=entries.filter(e=>parentPath(e.path)===cwd&&e.path!==cwd).sort((a,b)=>(a.kind==='folder'?-1:1)-(b.kind==='folder'?-1:1)||a.path.localeCompare(b.path));holder.replaceChildren();if(!children.length){holder.innerHTML='<p class="empty">This folder is empty.</p>';return}for(let e of children){let tile=document.createElement('div');tile.className='driveitem';let icon=document.createElement('div');icon.className='glyph';icon.textContent=e.kind==='folder'?'📁':e.type?.startsWith('image/')?'🖼️':e.type?.startsWith('audio/')?'🎵':e.type?.startsWith('video/')?'🎞️':'📄';let name=document.createElement('strong');name.textContent=e.path.split('/').at(-1);tile.append(icon,name);let buttons=document.createElement('div');buttons.style.cssText='display:flex;gap:4px;flex-wrap:wrap;justify-content:center';let open=document.createElement('button');open.textContent='Open';open.onclick=()=>e.kind==='folder'?(cwd=e.path,renderDrive()):openDriveFile(e);buttons.append(open);if(e.kind==='file'){let exportB=document.createElement('button');exportB.textContent='Export';exportB.onclick=()=>download(e.data,e.path.split('/').at(-1));buttons.append(exportB)}let del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{let entries=await allEntries(),targets=entries.filter(x=>x.path===e.path||x.path.startsWith(e.path+'/'));if(!confirm('Delete '+e.path.split('/').at(-1)+' and its contents ('+targets.length+' item(s))?'))return;for(let item of targets)await removeEntry(item.path);renderDrive()};buttons.append(del);tile.append(buttons);holder.append(tile)}}
async function openDriveFile(entry){let blob=entry.data,name=entry.path.split('/').at(-1),type=entry.type||'';if(type.startsWith('text/')||/\.(txt|md|json|csv|html|css|js)$/i.test(name)){let content=await blob.text(),el=makeWin('driveedit','✏️ '+name);if(!el){focusWin(windows.get('driveedit').w);closeWin('driveedit');el=makeWin('driveedit','✏️ '+name)}el.innerHTML='<div class="toolbar"><button id="driveSaveEdit">Save to C: Drive</button><button id="driveExportEdit">Export</button></div><textarea class="editor" id="driveEditor"></textarea>';$('#driveEditor').value=content;$('#driveSaveEdit').onclick=async()=>{await putEntry({...entry,data:new Blob([$('#driveEditor').value],{type:'text/plain'}),type:'text/plain'});notify('Saved '+name)};$('#driveExportEdit').onclick=()=>download(new Blob([$('#driveEditor').value],{type:'text/plain'}),name);return}let url=URL.createObjectURL(blob);if(type.startsWith('image/')||type.startsWith('audio/')||type.startsWith('video/')||type==='application/pdf'){let el=makeWin('preview','Preview: '+name);if(!el){closeWin('preview');el=makeWin('preview','Preview: '+name)}let node=type.startsWith('image/')?document.createElement('img'):type.startsWith('audio/')?document.createElement('audio'):type.startsWith('video/')?document.createElement('video'):document.createElement('iframe');node.src=url;node.style.cssText='max-width:100%;width:100%;max-height:100%;object-fit:contain';if(node.tagName==='AUDIO'||node.tagName==='VIDEO')node.controls=true;if(node.tagName==='IFRAME')node.style.height='100%';el.append(node);windows.get('preview').w.addEventListener('DOMNodeRemoved',()=>URL.revokeObjectURL(url),{once:true});return}download(blob,name);URL.revokeObjectURL(url)}
function notify(message){let el=$('#osnotice');if(!el){el=document.createElement('div');el.id='osnotice';el.style.cssText='position:fixed;right:15px;bottom:65px;z-index:20000;background:#102446;color:white;padding:12px;border:1px solid #79bdd5;border-radius:8px';document.body.append(el)}el.textContent=message;setTimeout(()=>{if(el.textContent===message)el.remove()},3000)}
function helper(){let el=makeWin('helper','🟣 Box Signal Helper (No AI)');if(!el)return;el.innerHTML='<div class="assistant-ui"><div class="assistant-log" id="helperlog" aria-live="polite"><p><strong>🟣 Helper:</strong> Hello! I’m the Box Signal desktop helper. I work with programmed commands, not AI. Try “open drive”, “open notepad”, “time”, “help”, or “make a folder”.</p></div><div class="assistant-chips" id="helperchips"></div><form id="helperform"><input id="helperinput" placeholder="What would you like to do?" aria-label="Ask the helper" autocomplete="off"><button type="submit">Send</button></form></div>';let chips=['Open drive','Open Notepad','Open Paint','Open Dot Bot','What time is it?','Help'];for(let cmd of chips){let b=document.createElement('button');b.textContent=cmd;b.onclick=()=>respond(cmd);$('#helperchips').append(b)}$('#helperform').onsubmit=e=>{e.preventDefault();let cmd=$('#helperinput').value.trim();if(cmd)respond(cmd);$('#helperinput').value=''};$('#helperinput').focus()}
function respond(raw){let log=$('#helperlog');if(!log)return;let user=document.createElement('p');user.textContent='You: '+raw;log.append(user);let cmd=raw.toLowerCase().replace(/[!?.,]/g,'').trim(),reply='',open=null;if(/\b(help|commands|what can you do)\b/.test(cmd))reply='I can open the C: drive, Notepad, Paint, Pocket Beat and Dot Bot; tell the time or date; and help you make folders. I use simple programmed commands.';else if(/\b(time|clock)\b/.test(cmd))reply='It is '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'.';else if(/\b(date|today|day)\b/.test(cmd))reply='Today is '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';else if(/\b(folder|directory)\b/.test(cmd)){open='drive';reply='Opening the C: drive. Use “+ Folder” to create a folder.'}else if(/\b(drive|files|explorer|storage)\b/.test(cmd)){open='drive';reply='Opening your virtual C: drive.'}else if(/\b(notepad|note|write|document|text)\b/.test(cmd)){open='notes';reply='Opening Notepad.'}else if(/\b(paint|draw|picture)\b/.test(cmd)){open='paint';reply='Opening Paint.'}else if(/\b(dot ?bot)\b/.test(cmd)){open='dot';reply='Opening Dot Bot.'}else if(/\b(beat|drum|music)\b/.test(cmd)){open='beat';reply='Opening Pocket Beat.'}else if(/\b(hello|hi|hey|hiya)\b/.test(cmd))reply='Hello there! Fancy making something?';else if(/\b(thanks|thank you|cheers)\b/.test(cmd))reply='You’re welcome, mate!';else reply='I don’t recognise that command yet. Type “help” to see what I can do.';let answer=document.createElement('p');let bold=document.createElement('strong');bold.textContent='🟣 Helper: ';answer.append(bold,document.createTextNode(reply));log.append(answer);log.scrollTop=log.scrollHeight;if(open)launch(open)}
</script></body></html>
