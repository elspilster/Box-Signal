<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Box Signal Calculator</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0a1020;color:#f6f7ff}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#283367 0,transparent 60%),#0a1020}.calc{width:min(100%,400px);background:#151c32;border:1px solid #364568;border-radius:26px;padding:22px;box-shadow:0 25px 70px #0008}.brand{font-size:12px;letter-spacing:.2em;color:#9bafff;font-weight:800;margin-bottom:16px}.screen{border-radius:17px;background:#080d1b;min-height:124px;padding:18px 16px;margin-bottom:16px;text-align:right;overflow:hidden}.history{font-size:15px;color:#96a5c6;min-height:24px;overflow-wrap:anywhere}.display{font-size:clamp(29px,8vw,46px);font-weight:650;letter-spacing:-.04em;overflow-wrap:anywhere;line-height:1.3}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}button{font:inherit;border:0;border-radius:14px;min-height:67px;background:#27334f;color:white;font-size:23px;cursor:pointer;touch-action:manipulation}button:hover{filter:brightness(1.18)}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #b4c5ff;outline-offset:2px}.utility{background:#35415d;color:#dfe8ff}.operator{background:#3c3b78;color:#dcd8ff}.equals{background:#7c6cf4;color:#fff}.zero{grid-column:span 2}.footer{margin-top:17px;text-align:center;color:#95a5c4;font-size:12px}small{display:block;margin-top:9px;color:#8795b6;text-align:center}@media(max-width:360px){.calc{padding:14px}.keys{gap:7px}button{min-height:58px}}
</style></head><body><main class="calc" aria-label="Calculator"><div class="brand">BOX SIGNAL · CALCULATOR</div><div class="screen" aria-live="polite" aria-atomic="true"><div class="history" id="history"></div><div class="display" id="display">0</div></div><div class="keys"><button class="utility" data-key="clear" aria-label="All clear">AC</button><button class="utility" data-key="back" aria-label="Backspace">⌫</button><button class="utility" data-key="percent" aria-label="Percent">%</button><button class="operator" data-key="/" aria-label="Divide">÷</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="operator" data-key="*" aria-label="Multiply">×</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="-" aria-label="Subtract">−</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="operator" data-key="+" aria-label="Add">+</button><button class="utility" data-key="sign" aria-label="Change sign">±</button><button class="zero" data-key="0">0</button><button data-key=".">.</button><button class="equals" data-key="=" aria-label="Equals">=</button></div><small>Keyboard: 0–9, + − × ÷, Enter, Backspace, Esc</small><div class="footer">Made by Box Signal · Works offline</div></main><script>
(()=>{'use strict';const display=document.querySelector('#display'),history=document.querySelector('#history');let current='0',stored=null,operator=null,awaiting=false,previous='';const signs={'+':'+','-':'−','*':'×','/':'÷'};function render(){display.textContent=current;history.textContent=previous||((operator!==null&&stored!==null)?`${format(stored)} ${signs[operator]}`:'');}function format(v){if(!Number.isFinite(v))return 'Error';return String(Number(Number(v).toPrecision(12)));}function calculate(a,b,op){switch(op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return b===0?NaN:a/b;default:return b;}}function clear(){current='0';stored=null;operator=null;awaiting=false;previous='';}function input(k){if(k==='clear'){clear();render();return;}if(current==='Error'){if(/[0-9.]/.test(k))clear();else if(k!=='clear'){return;}}if(/^[0-9]$/.test(k)){if(awaiting){current=k;awaiting=false;previous='';}else if(current.replace(/[-.]/g,'').length<15){current=current==='0'?k:current+k;} }else if(k==='.'){if(awaiting){current='0.';awaiting=false;previous='';}else if(!current.includes('.'))current+='.';}else if(k==='back'){if(awaiting){current='0';awaiting=false;}else current=current.length<=1||current.length===2&&current.startsWith('-')?'0':current.slice(0,-1);}else if(k==='sign'){if(current!=='0')current=current.startsWith('-')?current.slice(1):'-'+current;}else if(k==='percent'){current=format(Number(current)/100);}else if(['+','-','*','/'].includes(k)){if(operator!==null&&!awaiting){const v=calculate(stored,Number(current),operator);if(!Number.isFinite(v)){current='Error';stored=null;operator=null;previous='';render();return;}stored=v;current=format(v);}else if(stored===null){stored=Number(current);}operator=k;awaiting=true;previous='';}else if(k==='='){if(operator!==null&&stored!==null){const a=stored,b=Number(current);previous=`${format(a)} ${signs[operator]} ${format(b)} =`;current=format(calculate(a,b,operator));stored=null;operator=null;awaiting=true;}}render();}document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>input(b.dataset.key)));document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let k=e.key;if(k==='Enter'||k==='=')k='=';else if(k==='Escape'||k==='Delete')k='clear';else if(k==='Backspace')k='back';else if(k==='%')k='percent';else if(k==='x'||k==='X')k='*';else if(k===',')k='.';if(/^[0-9]$/.test(k)||['.','+','-','*','/','=','clear','back','percent'].includes(k)){e.preventDefault();input(k);}});render();})();
</script><style id="bs-popout-style">#bs-popout{position:fixed;right:16px;top:14px;z-index:99999;border:1px solid #7ce8d0;background:#172b38;color:#e7fff8;border-radius:999px;padding:9px 15px;font:700 13px system-ui,sans-serif;box-shadow:0 5px 18px #0005;cursor:pointer}#bs-popout:hover{background:#275565}@media print{#bs-popout{display:none!important}}</style><button id="bs-popout" type="button" title="Open this tool in a separate window">↗ Pop Out</button><script>(function(){const b=document.getElementById('bs-popout'),q=new URLSearchParams(location.search),standalone=q.has('popout');if(standalone){b.textContent='↙ Tools';b.title='Return to Box Signal Tools';b.onclick=()=>{location.href='/tools/'};return}b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('popout','1');const w=window.open(u.href,'boxsignal_'+location.pathname.replace(/\W/g,'_'),'popup=yes,width=950,height=760,resizable=yes,scrollbars=yes');if(w){w.focus()}else{b.textContent='Pop-up blocked';setTimeout(()=>b.textContent='↗ Pop Out',2500)}}})();</script></body></html>
