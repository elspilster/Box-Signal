<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Box Signal Notepad</title><style>*{box-sizing:border-box}body{margin:0;background:#101629;color:#edf1ff;font:16px system-ui}button,input,textarea{font:inherit}button{cursor:pointer;background:#25304d;color:white;border:1px solid #536080;border-radius:9px;padding:10px}button:hover{border-color:#b9a9ff}.app{display:grid;grid-template-columns:230px 1fr;height:100vh}aside{padding:18px;background:#19223b;display:flex;flex-direction:column;gap:12px}h1{margin:0;font-size:25px}small{color:#aea5ff}#notes{overflow:auto;flex:1}#notes button{display:block;width:100%;text-align:left;margin:5px 0}#notes .active{background:#6355bd}main{display:flex;flex-direction:column;min-width:0}.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #3a4661}.sheet{flex:1;display:flex;flex-direction:column;gap:12px;padding:24px;min-height:0}input,textarea{background:#19223b;color:white;border:1px solid #526080;border-radius:8px;padding:12px}#title{font-size:26px;font-weight:bold}textarea{flex:1;resize:none;line-height:1.6}footer{padding:8px 20px;color:#aaa6d5}#file{display:none}.light{background:#f5f6fa;color:#20283a}.light aside,.light input,.light textarea{background:#fff;color:#20283a}.light button{background:#e4e6f3;color:#20283a}@media(max-width:600px){.app{display:flex;flex-direction:column}aside{max-height:165px;padding:10px}#notes{display:flex;gap:5px}#notes button{min-width:130px}.sheet{padding:12px}}</style><div class="app"><aside><small><a href="/tools/" style="color:inherit">← BOX SIGNAL TOOLS</a></small><h1>📝 Notepad</h1><button id="new">＋ New note</button><div id="notes"></div><small>Autosaves in this browser. Export important notes as TXT.</small></aside><main><div class="bar"><button id="open">📂 Open TXT</button><button id="save">💾 Save TXT</button><button id="print">🖨 Print / PDF</button><button id="theme">☀ / ☾ Theme</button><button id="delete">Delete note</button></div><div class="sheet"><input id="title" placeholder="Note title"><textarea id="editor" placeholder="Start writing..."></textarea></div><footer id="status">Ready</footer></main></div><input id="file" type="file" accept=".txt,text/plain"><script>(function(){"use strict";function e(x){return document.getElementById(x)}var key="boxsignal-simple-notepad-v2",notes=[],active="";function id(){return "n"+Date.now()+Math.random()}function current(){return notes.find(n=>n.id===active)}function store(){try{localStorage.setItem(key,JSON.stringify({notes,active}))}catch(err){e("status").textContent="Local storage unavailable — use Save TXT"}}function capture(){var n=current();if(n){n.title=e("title").value;n.text=e("editor").value;store()}}function render(){e("notes").replaceChildren();notes.forEach(n=>{var b=document.createElement("button");b.textContent=n.title||"Untitled";b.className=n.id===active?"active":"";b.onclick=()=>select(n.id);e("notes").appendChild(b)})}function select(x){capture();active=x;var n=current();e("title").value=n?n.title:"";e("editor").value=n?n.text:"";render();store();stats()}function create(title,text){capture();var n={id:id(),title:title||"Untitled",text:text||""};notes.unshift(n);active=n.id;e("title").value=n.title;e("editor").value=n.text;render();store();stats()}function stats(){var t=e("editor").value;e("status").textContent=(t.trim()?t.trim().split(/\s+/).length:0)+" words · "+t.length+" characters · autosaved"}function changed(){capture();render();stats()}e("new").onclick=()=>{create("Untitled","");e("title").focus();e("title").select()};e("title").oninput=changed;e("editor").oninput=changed;e("open").onclick=()=>{e("file").value="";e("file").click()};e("file").onchange=function(){var f=this.files&&this.files[0];if(!f)return;if(f.size>5000000){alert("Select a TXT file under 5 MB");return}var r=new FileReader();r.onload=()=>{create(f.name.replace(/\.txt$/i,""),String(r.result));e("status").textContent="Opened "+f.name};r.onerror=()=>alert("Unable to open file");r.readAsText(f)};e("save").onclick=()=>{capture();var n=current(),name=(n.title||"Untitled").replace(/[\\/:*?"<>|]/g,"_")+".txt",url=URL.createObjectURL(new Blob([n.text],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},2000);e("status").textContent="Downloaded "+name};e("print").onclick=()=>window.print();e("theme").onclick=()=>document.body.classList.toggle("light");e("delete").onclick=()=>{if(!confirm("Delete this note?"))return;notes=notes.filter(n=>n.id!==active);active="";if(notes.length)select(notes[0].id);else create("Untitled","")};try{var obj=JSON.parse(localStorage.getItem(key)||"{}");if(Array.isArray(obj.notes)){notes=obj.notes;active=obj.active||""}}catch(err){}if(!notes.length)notes=[{id:id(),title:"Welcome to Box Signal Notepad",text:"Write your notes here. Open or save TXT files with the buttons above."}];if(!notes.some(n=>n.id===active))active=notes[0].id;var n=current();e("title").value=n.title;e("editor").value=n.text;render();store();stats()})();</script><style>@media print{aside,.bar,footer{display:none}.app{display:block;height:auto}.sheet{display:block}input,textarea{display:block;background:white!important;color:black!important;border:0;width:100%;height:auto;min-height:70vh}}</style><style id="bs-popout-style">#bs-popout{position:fixed;right:16px;top:14px;z-index:99999;border:1px solid #7ce8d0;background:#172b38;color:#e7fff8;border-radius:999px;padding:9px 15px;font:700 13px system-ui,sans-serif;box-shadow:0 5px 18px #0005;cursor:pointer}#bs-popout:hover{background:#275565}@media print{#bs-popout{display:none!important}}</style><button id="bs-popout" type="button" title="Open this tool in a separate window">↗ Pop Out</button><script>(function(){const b=document.getElementById('bs-popout'),q=new URLSearchParams(location.search),standalone=q.has('popout');if(standalone){b.textContent='↙ Tools';b.title='Return to Box Signal Tools';b.onclick=()=>{location.href='/tools/'};return}b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('popout','1');const w=window.open(u.href,'boxsignal_'+location.pathname.replace(/\W/g,'_'),'popup=yes,width=950,height=760,resizable=yes,scrollbars=yes');if(w){w.focus()}else{b.textContent='Pop-up blocked';setTimeout(()=>b.textContent='↗ Pop Out',2500)}}})();</script></html>
