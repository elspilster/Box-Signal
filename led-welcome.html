<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Box Signal — Welcome</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden}body{padding:7px;font-family:monospace}.frame{background:linear-gradient(145deg,#424048,#15151b 20%,#060608 70%,#393840);border:5px solid #34343b;border-radius:15px;padding:10px;box-shadow:0 12px 28px #0008}.screen{position:relative;overflow:hidden;height:104px;background:#060705;border:2px solid #000;border-radius:5px;box-shadow:inset 0 0 30px #000}.screen:after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 4px 5px),radial-gradient(ellipse,transparent 45%,#0009)}canvas{display:block;width:100%;height:100%}.footer{display:flex;justify-content:space-between;align-items:center;padding:7px 4px 0;font:9px system-ui,sans-serif;letter-spacing:.16em;color:#aaa}.dot{display:inline-block;background:#ffb13e;width:6px;height:6px;border-radius:50%;box-shadow:0 0 8px #ffb13e;margin-right:7px}@media(max-width:550px){.screen{height:85px}.footer{font-size:8px}}</style></head><body><div class="frame"><div class="screen"><canvas id="led" role="img" aria-label="Scrolling message: Hello, welcome to the Box Signal website. We hope you find it thought provoking and you enjoy being here! Like3 Mad x"></canvas></div><div class="footer"><span><i class="dot"></i>BOX SIGNAL</span><span>INPUT · OUTPUT</span></div></div><script>
(()=>{const text="Hello, welcome to the Box Signal website. We hope you find it thought provoking and you enjoy being here! Like3 Mad x";const canvas=document.getElementById('led'),ctx=canvas.getContext('2d');let w=0,h=0,off=document.createElement('canvas'),ow=0,oh=0,x=0,last=0;function setup(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=canvas.width=Math.round(r.width*d);h=canvas.height=Math.round(r.height*d);const font=Math.max(26,Math.round(h*.52));const oc=off.getContext('2d');oc.font='bold '+font+'px monospace';ow=Math.ceil(oc.measureText(text).width+30);oh=Math.ceil(font*1.5);off.width=ow;off.height=oh;oc.font='bold '+font+'px monospace';oc.textBaseline='middle';oc.fillStyle='white';oc.fillText(text,10,oh/2);x=w;}new ResizeObserver(setup).observe(canvas);function draw(t){const dt=last?Math.min((t-last)/1000,.06):0;last=t;ctx.fillStyle='#050605';ctx.fillRect(0,0,w,h);if(!w||!ow){requestAnimationFrame(draw);return}const step=Math.max(3,Math.round(w/210)),speed=Math.max(35,w*.105);x-=speed*dt;if(x < -ow)x=w+25;const y=(h-oh)/2;const start=Math.max(0,Math.floor(-x/step)*step),end=Math.min(ow,w-x+step);const oc=off.getContext('2d',{willReadFrequently:true}),data=oc.getImageData(0,0,ow,oh).data;for(let px=start;px<end;px+=step){for(let py=0;py<oh;py+=step){const ix=Math.min(ow-1,px+step/2|0),iy=Math.min(oh-1,py+step/2|0);if(data[(iy*ow+ix)*4+3]<110)continue;const dx=x+px,dy=y+py;if(dx<0||dx>w||dy<0||dy>h)continue;ctx.fillStyle='#ffb13e';ctx.globalAlpha=.2;ctx.beginPath();ctx.arc(dx,dy,step*.82,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(dx,dy,step*.32,0,Math.PI*2);ctx.fill();}}requestAnimationFrame(draw)}requestAnimationFrame(draw)})();
</script></body></html>
