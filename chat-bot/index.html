<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Bot — Box Signal</title><style>*{box-sizing:border-box}body{margin:0;background:#090c11;color:#f5f5f5;font:16px system-ui,sans-serif}.app{max-width:820px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:#111722}header{display:flex;justify-content:space-between;align-items:center;padding:22px;border-bottom:1px solid #29303a}h1{margin:0;font-size:25px}small{color:#b6bdc8}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font:inherit}#new{background:#283343;color:white}#messages{flex:1;min-height:60vh;padding:24px;display:flex;flex-direction:column;gap:12px;overflow:auto}.bubble{max-width:85%;padding:13px 17px;border-radius:16px;white-space:pre-wrap;line-height:1.5}.bot{align-self:flex-start;background:#283343}.you{align-self:flex-end;background:#6d44bb}form{display:flex;gap:10px;padding:18px;border-top:1px solid #29303a}input{flex:1;min-width:0;border-radius:10px;padding:14px;background:#fff;color:#111;border:0;font:inherit}#send{background:#ff793f;color:#171717;font-weight:700}.note{padding:0 20px 16px;color:#a4abb7;font-size:12px}a{color:#ffad7d}</style></head><body><div class="app"><header><div><h1>Chat Bot</h1><small>A traditional chatbot by <a href="/">Box Signal</a> — no AI</small></div><button id="new">New chat</button></header><main id="messages" aria-live="polite"></main><form id="form"><input id="input" placeholder="Say hello…" maxlength="500" required autocomplete="off" aria-label="Message"><button id="send">Send</button></form><div class="note">Rule-based. Messages stay in your browser and aren't sent to a server.</div></div><script>
const messages=document.querySelector('#messages'),input=document.querySelector('#input');let name='',topic='',turn=0,lastBot='',lastUser='',facts={},lastRule=-1;const STORE='boxsignal-chatbot-v2';
const pick=a=>a[Math.floor(Math.random()*a.length)];
function say(t,who='bot'){let e=document.createElement('div');e.className='bubble '+who;e.textContent=t;messages.append(e);messages.scrollTop=messages.scrollHeight;if(who==='bot')lastBot=t;save()}
function save(){try{localStorage.setItem(STORE,JSON.stringify({name,topic,turn,facts,lastUser,history:[...messages.children].slice(-80).map(e=>({who:e.classList.contains('you')?'you':'bot',text:e.textContent}))}))}catch(e){}}function restore(){try{let d=JSON.parse(localStorage.getItem(STORE)||'null');if(!d||!Array.isArray(d.history))return false;name=d.name||'';topic=d.topic||'';turn=d.turn||0;facts=d.facts||{};lastUser=d.lastUser||'';messages.replaceChildren();d.history.slice(-80).forEach(x=>{let e=document.createElement('div');e.className='bubble '+(x.who==='you'?'you':'bot');e.textContent=String(x.text).slice(0,1000);messages.append(e)});messages.scrollTop=messages.scrollHeight;return true}catch(e){return false}}function reset(){name='';topic='';turn=0;facts={};lastUser='';lastRule=-1;messages.replaceChildren();try{localStorage.removeItem(STORE)}catch(e){}say("Hello there! I'm Chat Bot. What shall we talk about?")}
const rules=[

[/\b(hello again|remember me|long time no see)\b/i,["Welcome back! What shall we chat about?"]],
[/\b(what's up|whats up|sup)\b/i,["Just chatting away, old-school style. What's happening with you?"]],
[/\b(what are you doing|what you doing)\b/i,["Waiting for a good conversation. You've arrived at the right time!"]],
[/\b(how old are you|your age)\b/i,["I'm a modern tribute to classic chatbots. Age is just a version number!"]],
[/\b(where do you live|where are you from)\b/i,["I live right here in your browser, courtesy of Box Signal."]],
[/\b(who made you|who created you|your creator)\b/i,["Box Signal made me using ordinary JavaScript. No AI required."]],
[/\b(box signal|boxsignal)\b/i,["Box Signal is the creative studio behind me. There's plenty more to explore on the website!"]],
[/\b(dot bot|dotbot)\b/i,["Dot Bot is one of Box Signal's other creations. I'm the old-fashioned cousin!"]],
[/\b(dino|pengu!n|penguin|purple hippo|bubbles)\b/i,["Ah, another Box Signal creation! Which one is your favourite?"]],
[/\b(are you real|are you alive|are you human)\b/i,["I'm a computer program, not a person. But I can still be good company!"]],
[/\b(can you learn|do you learn)\b/i,["I follow written rules. I can remember a few things you tell me in this browser, but I don't train myself."]],
[/\b(do you remember|remember anything)\b/i,["I can remember your name and a few favourites, as long as this browser keeps my local data."]],
[/\b(secret|privacy|private|data)\b/i,["Our conversation stays in your browser. I don't send your messages to a server."]],
[/\b(favourite colour|favorite color|colours|colors)\b/i,["Orange and purple have a certain Box Signal energy. What's your favourite?"]],
[/\b(space|moon|stars|planet|astronomy)\b/i,["Space is enormous! Would you rather visit the Moon or Mars?"]],
[/\b(dinosaur|dinosaurs|fossil)\b/i,["Dinosaurs are fascinating. Which one is your favourite?"]],
[/\b(travel|holiday|vacation|abroad)\b/i,["Where would you most like to travel?"]],
[/\b(sea|beach|ocean|swim)\b/i,["A day by the sea sounds lovely. Do you prefer sand or rock pools?"]],
[/\b(garden|gardening|plants|flowers)\b/i,["Gardens are full of little surprises. Do you grow anything?"]],
[/\b(coffee|tea|drink)\b/i,["Tea or coffee? It's an important question!"]],
[/\b(sleep|tired|exhausted)\b/i,["Sounds like a rest might be in order. Have you had a busy day?"]],
[/\b(dream|dreams|dreaming)\b/i,["Dreams can be wonderfully strange. Have you had an interesting one?"]],
[/\b(future|robot|robots)\b/i,["The future could be interesting. What would you like robots to help with?"]],
[/\b(past|history|nostalgia|retro)\b/i,["I have a soft spot for old-school computing. What era do you like?"]],
[/\b(internet|web|browser)\b/i,["The internet's changed a lot. What do you miss from the early web?"]],
[/\b(puzzle|riddle|quiz)\b/i,["Here's a riddle: What has keys but can't open locks? A piano!"]],
[/\b(tell me something|fun fact|fact)\b/i,["Fun fact: early chatbots such as ELIZA used pattern matching decades before modern AI chat."]],
[/\b(hungry|dinner|lunch|breakfast)\b/i,["What's on the menu?"]],
[/\b(birthday|party|celebrate)\b/i,["That sounds like a reason to celebrate!"]],
[/\b(sorry|apologise|apologize)\b/i,["No worries at all."]],
[/\b(please)\b/i,["Politeness noted! What would you like to chat about?"]],
[/\b(wow|amazing|incredible)\b/i,["Right? Sometimes the simplest things are the most fun."]],
[/\b(ok|okay|alright|fair enough)\b/i,["Sound! What's next?"]],
[/\b(what do you think|your opinion)\b/i,["I don't have personal opinions, but I'm always up for exploring an idea."]],
[/\b(what time|what's the time|what is the time)\b/i,["Your device says it's "+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+"."]],
[/\b(what date|what day is it|today's date)\b/i,["Today is "+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+"."]],

[/\b(hello|hi|hey|hiya|howdy)\b/i,["Hello! How's your day going?","Hey there! What have you been up to?"]],
[/\b(how are you|how're you)\b/i,["I'm doing well, thanks! How are you?","All systems cheerful! And you?"]],
[/\b(good|great|fine|brilliant|awesome|happy)\b/i,["Glad to hear it! What's made today good?","That's lovely. Tell me more!"]],
[/\b(bad|sad|upset|rough|stressed|lonely)\b/i,["I'm sorry to hear that. Want to talk about it?","That sounds difficult. I'm listening."]],
[/\b(thanks|thank you|cheers)\b/i,["You're welcome!","Anytime!"]],
[/\b(bye|goodbye|see you|goodnight)\b/i,["See you soon!","Take care!"]],
[/\b(joke|funny|laugh)\b/i,["Why did the computer get cold? It left its Windows open!","Why did the chatbot cross the road? It recognised a pattern on the other side."]],
[/\b(music|song|guitar|piano|band|sing)\b/i,["Music is a great subject! What do you enjoy listening to?","Do you make music, or mostly listen to it?"]],
[/\b(game|games|gaming|minecraft)\b/i,["What games are you into?","I like the idea of exploring a game world. What's your favourite?"]],
[/\b(movie|film|cinema)\b/i,["What kind of films do you enjoy?","Have you watched anything good lately?"]],
[/\b(book|books|reading|novel)\b/i,["What are you reading?","A good story can take you anywhere. What sort do you like?"]],
[/\b(food|eat|pizza|cooking)\b/i,["What's your favourite thing to eat?","Do you enjoy cooking?"]],
[/\b(weather|rain|sun|snow)\b/i,["I can't check live weather, but what's it like where you are?"]],
[/\b(work|job|school|college)\b/i,["How's that going for you?","What's been keeping you busy?"]],
[/\b(friend|friends|family)\b/i,["The people in our lives make a difference. Tell me more."]],
[/\b(dog|cat|pet|animal)\b/i,["Do you have any pets?","Animals are wonderful. Which ones do you like?"]],
[/\b(football|sport|tennis|cricket)\b/i,["Do you play or follow that sport?"]],
[/\b(computer|technology|internet|website|coding)\b/i,["Computers can be fascinating. What are you working on?"]],
[/\b(art|drawing|painting|pixel)\b/i,["I love talking about creative projects. What are you making?"]],
[/\b(idea|create|making|project)\b/i,["That sounds interesting. Tell me about your idea."]],
[/\b(what is your name|who are you)\b/i,["I'm Chat Bot, a traditional rule-based conversation bot from Box Signal."]],
[/\b(are you ai|are you artificial intelligence)\b/i,["Nope! I'm a collection of rules and responses, not a language model."]],
[/\b(what can you do|help)\b/i,["We can chat about music, games, books, art, hobbies and everyday life. Tell me what's on your mind."]],
[/\b(why|how come)\b/i,["That's a good question. What do you think?"]],
[/\b(yes|yeah|yep|sure|definitely)\b/i,["Nice! Tell me more.","Sounds good to me!"]],
[/\b(no|nope|not really)\b/i,["Fair enough. What would you prefer?"]],
[/\b(love|like|enjoy)\b/i,["What do you like most about it?"]],
[/\b(hate|dislike|don't like)\b/i,["What puts you off it?"]],
[/\b(bored|boring)\b/i,["Want a joke, or shall we talk about something new?"]],
[/\b(thinking|wondering|curious)\b/i,["What have you been thinking about?"]],
[/\b(tomorrow|today|yesterday|weekend)\b/i,["Have you got any plans?"]],
[/\b(hobby|hobbies|free time)\b/i,["What do you enjoy doing in your spare time?"]]
];
function respond(s){turn++;const q=s.trim();let n=q.match(/\b(?:my name is|call me|i'm called)\s+([a-z][a-z'-]{1,25})/i);if(n){name=n[1];save();return 'Nice to meet you, '+name+'! What shall we chat about?'}if(/\b(what's my name|what is my name|do you remember my name)\b/i.test(q))return name?'You told me your name is '+name+'.':"You haven't told me your name yet.";let fav=q.match(/\bmy favou?rite (colour|color|food|game|film|movie|song|animal|hobby) is (.{2,60})/i);if(fav){let k=fav[1].toLowerCase().replace('color','colour').replace('movie','film');facts[k]=fav[2].replace(/[.!?]+$/,'');save();return 'Got it! Your favourite '+k+' is '+facts[k]+'. I can remember that on this device.'}let ask=q.match(/\b(?:what is|what's|do you remember) my favou?rite (colour|color|food|game|film|movie|song|animal|hobby)\b/i);if(ask){let k=ask[1].toLowerCase().replace('color','colour').replace('movie','film');return facts[k]?'You told me your favourite '+k+' is '+facts[k]+'.':"You haven't told me your favourite "+k+" yet."}if(/\b(what do you remember about me|what do you know about me)\b/i.test(q)){let a=[name?'Your name is '+name:null,...Object.entries(facts).map(([k,v])=>'Your favourite '+k+' is '+v)].filter(Boolean);return a.length?a.join('. ')+'.':"Not much yet! Tell me your name or a favourite."}if(/\b(forget me|forget everything|clear memory)\b/i.test(q)){name='';facts={};save();return "I've cleared the details I remembered about you."}if(/\b(tell me another|another one|one more)\b/i.test(q)&&/joke|why did|what do you call/i.test(lastBot))return pick(["What do you call a sleeping dinosaur? A dino-snore!","Why was the computer late? It had a hard drive!","Why don't skeletons fight? They don't have the guts."]);if(/\b(what were we talking about|what was i saying)\b/i.test(q))return topic?'We were chatting about '+topic+'.':"We've only just started. Pick a topic!";let matches=[];for(let i=0;i<rules.length;i++)if(rules[i][0].test(q))matches.push(i);if(matches.length){let i=matches.find(i=>i!==lastRule)??matches[0];lastRule=i;topic=q.slice(0,70);save();return pick(rules[i][1])}topic=q.slice(0,70);save();return pick(["Tell me a little more about that"+(name?', '+name:'')+".","That's interesting. What happened next?","I'm not sure I follow. Could you explain it another way?","What do you think about it?","Let's explore that. What's the most interesting part?"])}
document.querySelector('#new').onclick=reset;document.querySelector('#form').onsubmit=e=>{e.preventDefault();let s=input.value.trim();if(!s)return;input.value='';say(s,'you');lastUser=s;setTimeout(()=>say(respond(s)),220)};if(!restore())reset();
</script></body></html>
