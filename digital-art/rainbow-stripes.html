<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainbow Stripes — Box Signal</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}.rainbow{position:fixed;inset:0;display:grid;grid-template-rows:repeat(7,minmax(0,1fr))}.rainbow div:nth-child(1){background:#ff0000}.rainbow div:nth-child(2){background:#ff9000}.rainbow div:nth-child(3){background:#ffff00}.rainbow div:nth-child(4){background:#00f000}.rainbow div:nth-child(5){background:#00e9f4}.rainbow div:nth-child(6){background:#0800ff}.rainbow div:nth-child(7){background:#a500f5}</style></head><body><div class="rainbow" role="img" aria-label="Seven horizontal rainbow stripes filling the screen"><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></body></html>
