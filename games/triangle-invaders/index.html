<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triangle Invaders — Box Signal Arcade</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#192b48,#070c17 65%);color:#e7faff;font-family:system-ui,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}.wrap{width:min(920px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0 0 10px;font-size:clamp(24px,5vw,38px);letter-spacing:.14em;color:#72efff;text-shadow:0 0 24px #2ac6ff77}.hud{display:flex;gap:20px;font-weight:700;letter-spacing:.08em;font-size:14px}.hud b{color:#ffda75}canvas{display:block;width:100%;aspect-ratio:900/600;border:2px solid #376c87;border-radius:12px;background:#070f20;box-shadow:0 12px 50px #0008;touch-action:none}button{border:1px solid #66d9ed;background:#17394c;color:#e7faff;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}button:hover{background:#255e75}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.help{text-align:center;color:#b5c9d6;font-size:13px;margin:12px 0 0}.touch{display:flex;justify-content:space-between;margin-top:12px;gap:12px}.touch button{min-width:85px;min-height:52px;font-size:20px;touch-action:none;user-select:none}.touch button:last-child{background:#61344c;border-color:#ff83af}@media(min-width:850px){.touch{display:none}}</style></head><body><div class="wrap"><header><h1>▲ TRIANGLE INVADERS</h1><div class="hud"><span>SCORE <b id="score">00000</b></span><span>LIVES <b id="lives">3</b></span><span>WAVE <b id="wave">1</b></span></div></header><canvas id="game" width="900" height="600" aria-label="Arcade shooter game"></canvas><div class="controls"><button id="start">START / RESTART</button><button id="pause">PAUSE</button><button id="sound">SOUND: ON</button></div><div class="touch"><button id="left" aria-label="Move left">◀</button><button id="fire" aria-label="Fire">● FIRE</button><button id="right" aria-label="Move right">▶</button></div><p class="help">Move: ← → or A / D · Shoot: SPACE · Pause: P · On phones, use the buttons below the game.</p></div><script>(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=900,H=600,scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('wave');let state='ready',score=0,lives=3,wave=1,player,aliens=[],shots=[],enemyShots=[],particles=[],keys={},last=0,fireWait=0,alienFire=0,dir=1,drop=0,stars=[],sound=true,audio;function beep(freq,duration,type='square',vol=.025){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}function rnd(a,b){return a+Math.random()*(b-a)}for(let i=0;i<100;i++)stars.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.5,2),s:rnd(.1,.5)});function setupWave(){aliens=[];for(let row=0;row<4;row++)for(let col=0;col<10;col++)aliens.push({x:130+col*64,y:70+row*55,w:31,h:30,row,alive:true});dir=1;drop=0;alienFire=1.1}function updateHud(){scoreEl.textContent=String(score).padStart(5,'0');livesEl.textContent=lives;waveEl.textContent=wave}function reset(){score=0;lives=3;wave=1;player={x:450,y:536,w:42,h:34,invuln:0};shots=[];enemyShots=[];particles=[];fireWait=0;setupWave();state='playing';updateHud()}function burst(x,y,color,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-150,150),vy:rnd(-160,130),life:rnd(.25,.7),color})}function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}function shoot(){if(fireWait>0||state!=='playing')return;shots.push({x:player.x,y:player.y-25,w:5,h:20});fireWait=.23;beep(640,.06)}function update(dt){for(const s of stars){s.y+=s.s*dt*35;if(s.y>H)s.y=0}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(state!=='playing')return;fireWait-=dt;player.invuln=Math.max(0,player.invuln-dt);let movement=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);player.x=Math.max(32,Math.min(W-32,player.x+movement*390*dt));if(keys[' ' ]||keys.fire)shoot();for(const s of shots)s.y-=570*dt;for(const s of enemyShots)s.y+=280*dt+wave*12*dt;shots=shots.filter(s=>s.y>-30);enemyShots=enemyShots.filter(s=>s.y<H+30);const living=aliens.filter(a=>a.alive);let edge=false;const speed=(30+wave*11+(40-living.length)*1.7)*dt*dir;for(const a of living){a.x+=speed;if(a.x<28||a.x>W-28)edge=true}if(edge){dir*=-1;for(const a of living)a.y+=20}for(const a of living){if(a.y>500){state='over';beep(100,.5);break}for(const s of shots){if(!s.dead&&hit({x:a.x,y:a.y,w:a.w,h:a.h},s)){a.alive=false;s.dead=true;score+=(4-a.row)*10;burst(a.x,a.y,['#ff7dbe','#ffbc6b','#a58cff','#7cf3c8'][a.row]);beep(190+Math.random()*170,.1,'sawtooth');updateHud();break}}}shots=shots.filter(s=>!s.dead);alienFire-=dt;if(alienFire<=0&&living.length){const candidates=living.filter(a=>a.alive),a=candidates[Math.floor(Math.random()*candidates.length)];if(a)enemyShots.push({x:a.x,y:a.y+15,w:7,h:18});alienFire=Math.max(.28,1.05-wave*.07)*rnd(.6,1.3)}for(const s of enemyShots){if(!s.dead&&player.invuln===0&&hit({x:player.x,y:player.y,w:player.w-10,h:player.h-5},s)){s.dead=true;lives--;player.invuln=1.7;burst(player.x,player.y,'#72efff',22);beep(85,.35,'sawtooth');updateHud();if(lives<=0)state='over'}}enemyShots=enemyShots.filter(s=>!s.dead);if(aliens.every(a=>!a.alive)){wave++;shots=[];enemyShots=[];setupWave();player.invuln=1.2;beep(920,.25,'sine');updateHud()}}function triangle(x,y,size,color,down=false){ctx.fillStyle=color;ctx.beginPath();if(down){ctx.moveTo(x,y+size);ctx.lineTo(x-size,y-size*.7);ctx.lineTo(x+size,y-size*.7)}else{ctx.moveTo(x,y-size);ctx.lineTo(x-size,y+size*.7);ctx.lineTo(x+size,y+size*.7)}ctx.closePath();ctx.fill()}function draw(){ctx.fillStyle='#071122';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle='#b7d5fa';ctx.globalAlpha=.2+s.r/3;ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;ctx.strokeStyle='#1b3b56';ctx.beginPath();ctx.moveTo(0,574);ctx.lineTo(W,574);ctx.stroke();for(const a of aliens)if(a.alive){const color=['#ff7dbe','#ffbc6b','#a58cff','#7cf3c8'][a.row];ctx.shadowColor=color;ctx.shadowBlur=13;triangle(a.x,a.y,17,color,true);ctx.shadowBlur=0;ctx.fillStyle='#071122';ctx.fillRect(a.x-8,a.y-7,4,4);ctx.fillRect(a.x+4,a.y-7,4,4)}if(player&&!(player.invuln>0&&Math.floor(player.invuln*10)%2)){ctx.shadowColor='#70efff';ctx.shadowBlur=20;triangle(player.x,player.y,24,'#70efff');ctx.fillStyle='#fff';ctx.fillRect(player.x-5,player.y-3,10,17);ctx.shadowBlur=0}ctx.fillStyle='#a9ffff';for(const s of shots)ctx.fillRect(s.x-2,s.y-9,4,18);ctx.fillStyle='#ff799f';for(const s of enemyShots){ctx.fillRect(s.x-3,s.y-8,6,16)}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;if(state!=='playing'){ctx.fillStyle='#06101bdc';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#78efff';ctx.font='bold 52px system-ui';ctx.fillText(state==='ready'?'TRIANGLE INVADERS':state==='paused'?'PAUSED':'GAME OVER',W/2,250);ctx.fillStyle='#f0fbff';ctx.font='23px system-ui';ctx.fillText(state==='over'?`Final score: ${score}`:'Defend Earth from the descending triangles!',W/2,300);ctx.font='18px system-ui';ctx.fillText(state==='paused'?'Press P to resume':'Press START to play',W/2,345)}}function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}function togglePause(){if(state==='playing')state='paused';else if(state==='paused')state='playing'}document.getElementById('start').onclick=reset;document.getElementById('pause').onclick=togglePause;document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent='SOUND: '+(sound?'ON':'OFF')};window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='p'&&!e.repeat)togglePause();keys[k]=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>{keys={};if(state==='playing')state='paused'});for(const [id,key]of [['left','arrowleft'],['right','arrowright'],['fire','fire']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false)}requestAnimationFrame(frame)})();</script></body></html>
