<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PONG — Browser Arcade</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#172d40,#070c13 65%);font:16px system-ui,Segoe UI,sans-serif;color:#e9fcff}.wrap{width:min(94vw,920px);text-align:center}h1{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:.28em;margin:12px 0;color:#6df9e6;text-shadow:0 0 25px #18b9aa77}.sub{color:#a9c7d2;margin:0 0 18px}.screen{position:relative;border:2px solid #2c7c87;border-radius:12px;overflow:hidden;box-shadow:0 0 40px #13d2bd22;background:#06121d}canvas{display:block;width:100%;height:auto;touch-action:none}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:18px 0}button{cursor:pointer;background:#14303d;color:#e8ffff;border:1px solid #2e7f89;padding:12px 20px;border-radius:8px;font:600 15px system-ui}button:hover,button:focus-visible{background:#22515d;outline:2px solid #56ddcc}button.active{background:#126e6d;border-color:#5af3e1}.help{font-size:14px;color:#a9c7d2;line-height:1.6}kbd{background:#1c3340;padding:2px 5px;border-radius:4px}
</style></head><body><main class="wrap"><h1>PONG</h1><p class="sub">A little old-school arcade, built for your browser.</p><div class="screen"><canvas id="game" width="800" height="480" aria-label="Pong game. Move your paddle with mouse, touch, or arrow keys."></canvas></div><div class="controls"><button id="start">Start / Pause</button><button id="reset">New Game</button><button id="mode" class="active">1 Player · vs Computer</button></div><p class="help">Move with <kbd>↑</kbd> / <kbd>↓</kbd>, <kbd>W</kbd> / <kbd>S</kbd>, mouse or touch. In 2-player mode: left paddle <kbd>W</kbd>/<kbd>S</kbd>, right paddle <kbd>↑</kbd>/<kbd>↓</kbd>. <kbd>Space</kbd> pauses. First to 7 wins.</p></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),W=c.width,H=c.height;const startBtn=document.querySelector('#start'),resetBtn=document.querySelector('#reset'),modeBtn=document.querySelector('#mode');let two=false,running=false,over=false,last=0,raf=0;const keys=new Set();const paddleH=92,paddleW=12,ballR=8;const left={x:28,y:H/2-paddleH/2,score:0},right={x:W-40,y:H/2-paddleH/2,score:0};const ball={x:W/2,y:H/2,vx:0,vy:0};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function serve(dir=Math.random()<.5?-1:1){ball.x=W/2;ball.y=H/2;ball.vx=dir*330;ball.vy=(Math.random()*2-1)*195}function reset(){running=false;over=false;left.score=right.score=0;left.y=right.y=H/2-paddleH/2;serve();draw()}function toggle(){if(over)reset();running=!running;last=performance.now();if(running&&!raf)raf=requestAnimationFrame(loop);draw()}function movePointer(e){const r=c.getBoundingClientRect();const y=(e.clientY-r.top)*H/r.height;left.y=clamp(y-paddleH/2,0,H-paddleH)}function update(dt){const speed=510;if(keys.has('w')||(!two&&keys.has('arrowup')))left.y-=speed*dt;if(keys.has('s')||(!two&&keys.has('arrowdown')))left.y+=speed*dt;if(two){if(keys.has('arrowup'))right.y-=speed*dt;if(keys.has('arrowdown'))right.y+=speed*dt}else{const target=ball.y-paddleH/2;right.y+=clamp(target-right.y,-335*dt,335*dt)}left.y=clamp(left.y,0,H-paddleH);right.y=clamp(right.y,0,H-paddleH);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-ballR<0){ball.y=ballR;ball.vy=Math.abs(ball.vy)}if(ball.y+ballR>H){ball.y=H-ballR;ball.vy=-Math.abs(ball.vy)}for(const [p,dir] of [[left,1],[right,-1]]){if((dir===1&&ball.vx<0||dir===-1&&ball.vx>0)&&ball.x+ballR>p.x&&ball.x-ballR<p.x+paddleW&&ball.y+ballR>p.y&&ball.y-ballR<p.y+paddleH){ball.x=dir===1?p.x+paddleW+ballR:p.x-ballR;const hit=clamp((ball.y-(p.y+paddleH/2))/(paddleH/2),-1,1);const v=Math.min(700,Math.hypot(ball.vx,ball.vy)*1.06);ball.vx=dir*v*Math.cos(hit*.95);ball.vy=v*Math.sin(hit*.95)}}if(ball.x< -ballR){right.score++;point(-1)}else if(ball.x>W+ballR){left.score++;point(1)}}function point(dir){if(left.score>=7||right.score>=7){running=false;over=true}else{serve(dir)}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#071623';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1c4752';ctx.setLineDash([12,16]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2,18);ctx.lineTo(W/2,H-18);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#b3d5dc';ctx.font='bold 60px ui-monospace,Consolas,monospace';ctx.textAlign='center';ctx.fillText(left.score,W*.27,74);ctx.fillText(right.score,W*.73,74);ctx.shadowBlur=18;ctx.shadowColor='#66f8e4';ctx.fillStyle='#6df9e6';ctx.fillRect(left.x,left.y,paddleW,paddleH);ctx.fillStyle='#ffbc71';ctx.shadowColor='#ffbc71';ctx.fillRect(right.x,right.y,paddleW,paddleH);ctx.shadowColor='#e9ffff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ballR,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(!running){ctx.fillStyle='#06121ddd';ctx.fillRect(0,H/2-60,W,120);ctx.fillStyle='#eaffff';ctx.font='bold 30px system-ui';ctx.fillText(over?(left.score>right.score?'LEFT PLAYER WINS!':two?'RIGHT PLAYER WINS!':'COMPUTER WINS!'):'PONG',W/2,H/2-9);ctx.font='17px system-ui';ctx.fillStyle='#a9d3d7';ctx.fillText(over?'Press Start for a new game':'Press Start or Space to play',W/2,H/2+28)}}function loop(t){raf=0;if(!running)return;const dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();if(running)raf=requestAnimationFrame(loop)}startBtn.addEventListener('click',toggle);resetBtn.addEventListener('click',reset);modeBtn.addEventListener('click',()=>{two=!two;modeBtn.textContent=two?'2 Players · Local':'1 Player · vs Computer';modeBtn.classList.toggle('active',!two);reset()});c.addEventListener('pointermove',e=>{if(!two||e.pointerType==='touch')movePointer(e)});c.addEventListener('pointerdown',movePointer);window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown',' ','w','s'].includes(k))e.preventDefault();if(k===' '&&!e.repeat)toggle();keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;draw()}});reset()})();
</script></body></html>
