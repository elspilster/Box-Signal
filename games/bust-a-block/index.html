<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bust A Block | Box Signal</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#192b4d,#070a13 75%);color:#f5f5ff;font:16px system-ui,Arial,sans-serif;display:grid;place-items:center;padding:16px}.shell{width:min(100%,790px)}h1{color:#ffce55;text-shadow:0 3px #e56a60,0 0 24px #ffb63b88;margin:8px 0;font-size:clamp(28px,6vw,44px);letter-spacing:.08em}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.tag{font-size:12px;color:#87dafa;letter-spacing:.2em;font-weight:900}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stats span{padding:9px 14px;border:1px solid #354b70;border-radius:8px;background:#101c32}.stats b{color:#ffce55}.board{position:relative;border:5px solid #6079a8;border-radius:12px;overflow:hidden;box-shadow:0 0 35px #2a91ff35;background:#080d1b}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;background:#071020dc;display:grid;place-content:center;text-align:center;padding:20px}.overlay[hidden]{display:none}.overlay h2{font-size:clamp(28px,6vw,48px);color:#ffce55;margin:0 0 12px}.overlay p{line-height:1.6}button{background:#ffb83f;color:#111827;border:0;border-radius:7px;padding:13px 25px;font-weight:900;font-size:16px;cursor:pointer}button:hover{background:#ffe38d}.hint{color:#a6bad1;font-size:13px;line-height:1.6}.hint a{color:#8eefff}</style></head><body><div class="shell"><div class="top"><div><div class="tag">BOX SIGNAL ARCADE</div><h1>BUST A BLOCK!</h1></div><a style="color:#8eefff" href="/games/">← ALL GAMES</a></div><div class="stats"><span>SCORE <b id="score">0</b></span><span>LIVES <b id="lives">3</b></span><span>LEVEL <b id="level">1</b></span><span>BEST <b id="best">0</b></span></div><div class="board"><canvas id="game" width="760" height="540" aria-label="Brick breaking arcade game"></canvas><div class="overlay" id="overlay"><h2 id="heading">BUST A BLOCK!</h2><p id="info">Move the paddle with your mouse, touch or arrow keys.<br>Break every brick and keep the ball in play!</p><button id="start">START GAME</button></div></div><p class="hint">Move: mouse / touch / ← → &nbsp; · &nbsp; Launch: Space / click / tap &nbsp; · &nbsp; Pause: P</p></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),ov=document.getElementById('overlay'),head=document.getElementById('heading'),info=document.getElementById('info'),btn=document.getElementById('start');const W=c.width,H=c.height;let paddle,ball,bricks,score=0,lives=3,level=1,playing=false,paused=false,keys={},last=0,particles=[];let best=0;try{best=Number(localStorage.getItem('boxsignal-bust-best'))||0}catch(e){}function hud(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('level').textContent=level;document.getElementById('best').textContent=best}function resetBall(){paddle={x:W/2-55,y:H-38,w:110,h:14};ball={x:W/2,y:H-52,vx:3.5,vy:-4.5,r:8,stuck:true}}function build(){bricks=[];const colors=['#ff6583','#ff9c53','#ffdc66','#6fe3a1','#65c9ef','#b48bff'];for(let row=0;row<Math.min(4+level,8);row++)for(let col=0;col<10;col++)bricks.push({x:24+col*72,y:55+row*28,w:66,h:20,color:colors[row%colors.length],alive:true})}function init(){score=0;lives=3;level=1;particles=[];resetBall();build();hud();playing=true;paused=false;ov.hidden=true}function launch(){if(ball.stuck){ball.stuck=false;ball.vx=3.3*(Math.random()>.5?1:-1);ball.vy=-4.7}}function show(title,msg,button){playing=false;ov.hidden=false;head.textContent=title;info.textContent=msg;btn.textContent=button}btn.onclick=init;function moveTo(clientX){const rect=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(clientX-rect.left)/rect.width*W-paddle.w/2));if(ball.stuck)ball.x=paddle.x+paddle.w/2}c.addEventListener('mousemove',e=>moveTo(e.clientX));c.addEventListener('pointerdown',e=>{moveTo(e.clientX);if(playing)launch()});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&playing)launch();if(e.code==='KeyP'&&playing)paused=!paused});window.addEventListener('keyup',e=>keys[e.code]=false);function rectHit(b,r){return b.x+b.r>r.x&&b.x-b.r<r.x+r.w&&b.y+b.r>r.y&&b.y-b.r<r.y+r.h}function update(dt){if(!playing||paused)return;const k=Math.min(dt/16.67,2);if(keys.ArrowLeft)paddle.x-=8*k;if(keys.ArrowRight)paddle.x+=8*k;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return}const prevX=ball.x,prevY=ball.y;ball.x+=ball.vx*k;ball.y+=ball.vy*k;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&rectHit(ball,paddle)){ball.y=paddle.y-ball.r;ball.vy=-Math.abs(ball.vy);ball.vx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*5.5;ball.vx=Math.max(-6,Math.min(6,ball.vx))}for(const b of bricks){if(!b.alive||!rectHit(ball,b))continue;b.alive=false;score+=10*level;if(score>best){best=score;try{localStorage.setItem('boxsignal-bust-best',best)}catch(e){}}const side=prevX+ball.r<=b.x||prevX-ball.r>=b.x+b.w;if(side)ball.vx*=-1;else ball.vy*=-1;for(let i=0;i<8;i++)particles.push({x:ball.x,y:ball.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:25,color:b.color});hud();break}if(ball.y>H+ball.r){lives--;hud();if(lives<=0){show('GAME OVER','You scored '+score+' points. Give it another go!','PLAY AGAIN')}else resetBall()}if(playing&&bricks.every(b=>!b.alive)){level++;resetBall();build();hud()}particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx*k;p.y+=p.vy*k}}function draw(){g.fillStyle='#080d1b';g.fillRect(0,0,W,H);g.strokeStyle='#16233d';g.lineWidth=1;for(let x=0;x<W;x+=38){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=38){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}for(const b of bricks)if(b.alive){g.shadowBlur=13;g.shadowColor=b.color;g.fillStyle=b.color;g.fillRect(b.x,b.y,b.w,b.h);g.shadowBlur=0;g.fillStyle='#ffffff40';g.fillRect(b.x+3,b.y+2,b.w-6,3)}g.shadowBlur=19;g.shadowColor='#74dcff';g.fillStyle='#8ce7ff';g.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);g.shadowColor='#ffdf75';g.fillStyle='#ffdf75';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.shadowBlur=0;for(const p of particles){g.globalAlpha=p.life/25;g.fillStyle=p.color;g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;if(paused){g.fillStyle='#000a';g.fillRect(0,0,W,H);g.fillStyle='white';g.font='bold 40px system-ui';g.textAlign='center';g.fillText('PAUSED',W/2,H/2);g.textAlign='start'}}function frame(t){const dt=last?t-last:16.67;last=t;update(dt);draw();requestAnimationFrame(frame)}resetBall();build();hud();requestAnimationFrame(frame)})();
</script></body></html>
