<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Brain | Box Signal</title><style>body{margin:0;background:#0a1020;color:#f4f6ff;font:16px system-ui;text-align:center}header{padding:22px}a{color:#8fe8ff}.wrap{display:flex;gap:25px;justify-content:center;flex-wrap:wrap;padding:12px}canvas{width:min(85vw,512px);height:min(85vw,512px);image-rendering:pixelated;border:8px solid #273551;border-radius:12px;cursor:crosshair;background:#12172b}aside{width:min(90vw,310px);text-align:left;background:#151d32;padding:20px;border-radius:15px}input,button,select{font:inherit;border:1px solid #425579;border-radius:9px;padding:11px;background:#243352;color:white;margin:4px}input{width:85%}button{cursor:pointer}button:hover{background:#395582}h1{margin:5px;color:#9deeff}small{color:#a7b4d4}#palette button{width:29px;height:29px;padding:0;border-radius:5px}</style><header><a href="/">← Box Signal</a><h1>🧠 Pixel Brain</h1><small>16 × 16 animated pixel artist · browser experiment</small></header><div class="wrap"><canvas id="art" width="16" height="16"></canvas><aside><label for="idea">What shall Pixel Brain draw?</label><input id="idea" placeholder="robot, rocket, flower, sunset..."><button id="draw">✨ Draw idea</button><button id="surprise">🎲 Surprise me</button><p>Animation</p><select id="effect"><option value="blink">Blink</option><option value="wave">Wave</option><option value="bounce">Bounce</option><option value="spin">Spin</option><option value="rainbow">Rainbow</option></select><button id="animate">▶ Animate</button><button id="stop">■ Stop</button><p>Paint colour</p><div id="palette"></div><button id="clear">Clear</button><button id="png">Save PNG</button><p><small>Draw with your mouse or finger. No account, API key or AI service needed. Drawings are generated from small built-in pixel patterns.</small></p></aside></div><script>(()=>{const c=document.getElementById('art'),x=c.getContext('2d'),palette=['#000000','#ffffff','#f95d6a','#ffbe55','#f9f871','#54d69b','#45b8e8','#8c6cff','#f68dff','#70513b'];let grid=Array(256).fill(''),ink=palette[2],timer=null,phase=0;const el=id=>document.getElementById(id);x.imageSmoothingEnabled=false;function render(g=grid){x.fillStyle='#10172a';x.fillRect(0,0,16,16);g.forEach((v,i)=>{if(v){x.fillStyle=v;x.fillRect(i%16,Math.floor(i/16),1,1)}})}function dot(a,b,col){if(a>=0&&a<16&&b>=0&&b<16)grid[b*16+a]=col}function rect(a,b,w,h,col){for(let y=b;y<b+h;y++)for(let xx=a;xx<a+w;xx++)dot(xx,y,col)}function circle(cx,cy,r,col){for(let y=0;y<16;y++)for(let xx=0;xx<16;xx++)if((xx-cx)**2+(y-cy)**2<=r*r)dot(xx,y,col)}function make(s){grid.fill('');s=s.toLowerCase();if(/robot|bot/.test(s)){rect(4,3,8,8,'#8c9fb9');rect(5,4,6,5,'#d9e3f1');rect(6,6,1,1,'#18243c');rect(9,6,1,1,'#18243c');rect(6,9,4,1,'#f95d6a');rect(7,1,2,2,'#ffbe55');rect(5,11,2,3,'#8c9fb9');rect(9,11,2,3,'#8c9fb9')}else if(/rocket|ship/.test(s)){rect(7,3,2,9,'#f4f6ff');rect(6,6,4,6,'#a5b7d1');circle(8,7,1,'#45b8e8');rect(5,10,2,3,'#f95d6a');rect(9,10,2,3,'#f95d6a');rect(7,12,2,3,'#ffbe55');dot(7,2,'#ffffff');dot(8,2,'#ffffff')}else if(/flower|rose/.test(s)){rect(7,8,2,7,'#54d69b');circle(8,6,4,'#f95d6a');circle(8,6,2,'#ffbe55');rect(5,11,2,2,'#54d69b');rect(9,12,2,2,'#54d69b')}else if(/sun|sky|sunset/.test(s)){rect(0,0,16,16,'#8c6cff');rect(0,9,16,7,'#f95d6a');circle(8,8,5,'#ffbe55');rect(0,12,16,4,'#273551')}else if(/heart|love/.test(s)){circle(5,5,3,'#f95d6a');circle(10,5,3,'#f95d6a');for(let y=5;y<13;y++)for(let xx=2;xx<14;xx++)if(Math.abs(xx-7.5)+y*.75<13)dot(xx,y,'#f95d6a')}else{for(let i=0;i<75;i++){let a=Math.random()*16|0,b=Math.random()*16|0;dot(a,b,palette[2+(Math.random()*8|0)])}}render()}function animate(){clearInterval(timer);phase=0;timer=setInterval(()=>{phase++;const e=el('effect').value,g=Array(256).fill('');grid.forEach((v,i)=>{if(!v)return;let a=i%16,b=i/16|0;if(e==='blink'&&phase%8===0&&b===6)return;if(e==='wave')a+=Math.round(Math.sin(b*.65+phase*.5));if(e==='bounce')b+=(phase%6<3?-1:1);if(e==='spin'){const t=(phase%4)*Math.PI/2,dx=a-7.5,dy=b-7.5;a=Math.round(7.5+dx*Math.cos(t)-dy*Math.sin(t));b=Math.round(7.5+dx*Math.sin(t)+dy*Math.cos(t))}if(e==='rainbow')v=palette[2+((i+phase)%8)];if(a>=0&&a<16&&b>=0&&b<16)g[b*16+a]=v});render(g)},170)}let painting=false;function paint(e){if(!painting)return;const r=c.getBoundingClientRect(),a=Math.floor((e.clientX-r.left)*16/r.width),b=Math.floor((e.clientY-r.top)*16/r.height);dot(a,b,ink);render()}c.addEventListener('pointerdown',e=>{painting=true;c.setPointerCapture(e.pointerId);paint(e)});c.addEventListener('pointermove',paint);c.addEventListener('pointerup',()=>painting=false);palette.forEach(p=>{const b=document.createElement('button');b.style.background=p;b.title=p;b.onclick=()=>ink=p;el('palette').appendChild(b)});el('draw').onclick=()=>{clearInterval(timer);make(el('idea').value)};el('surprise').onclick=()=>{clearInterval(timer);make(['robot','rocket','flower','sunset','heart','abstract'][Math.random()*6|0])};el('animate').onclick=animate;el('stop').onclick=()=>{clearInterval(timer);render()};el('clear').onclick=()=>{clearInterval(timer);grid.fill('');render()};el('png').onclick=()=>{const out=document.createElement('canvas');out.width=512;out.height=512;const o=out.getContext('2d');o.imageSmoothingEnabled=false;o.drawImage(c,0,0,512,512);const a=document.createElement('a');a.download='pixel-brain.png';a.href=out.toDataURL('image/png');a.click()};make('robot')})();</script></html>
