<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Watch · Box Signal</title><meta name="theme-color" content="#090f1a"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#233452,#090e19 70%);color:#e9faff;font:16px system-ui,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(100%,620px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px;font-size:12px;font-weight:800;letter-spacing:.16em}.top a{color:#9ec5dc;text-decoration:none}.watch{position:relative;background:#111827;border:12px solid #2b3446;border-radius:32px;box-shadow:0 0 0 5px #0a101d,0 25px 80px #0009,inset 0 0 0 3px #4c5971;padding:40px 20px 34px}.watch:before,.watch:after{content:"";position:absolute;left:14%;right:14%;height:14px;background:repeating-linear-gradient(90deg,#30394a 0 18px,#212938 18px 25px);border:3px solid #161d29}.watch:before{top:-25px;border-radius:7px 7px 0 0}.watch:after{bottom:-25px;border-radius:0 0 7px 7px}.face{background:#071b1b;border:5px solid #0a1117;border-radius:14px;box-shadow:inset 0 0 32px #000b,0 0 18px #50f2b522;padding:20px 8px}.time{font-family:Consolas,'Courier New',monospace;font-size:clamp(42px,9vw,83px);font-weight:900;letter-spacing:-.055em;color:#7cffbb;text-shadow:0 0 14px #38e99a66;font-variant-numeric:tabular-nums}.date{font-family:Consolas,monospace;font-size:clamp(12px,2.8vw,19px);letter-spacing:.08em;color:#8ecdb5;margin-top:6px}.status{font-size:10px;color:#70c5a2;letter-spacing:.3em;margin-bottom:12px}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:38px}button{cursor:pointer;background:#1e3850;border:1px solid #527c9d;border-radius:9px;color:#e8f9ff;padding:13px 18px;font:700 13px system-ui}button:hover,button:focus-visible{background:#315879;outline:2px solid #8be6ed;outline-offset:2px}.hint{color:#94a9bc;font-size:12px;line-height:1.6;margin-top:20px}.popout .top,.popout .hint,.popout #pop,.popout #back{display:none}.popout{padding:12px;min-height:100vh}.popout .shell{width:100%}.popout .watch{padding:16px 8px;border-width:7px;border-radius:20px}.popout .time{font-size:clamp(30px,10vw,65px)}.popout .buttons{margin-top:22px}@media(max-width:460px){.watch{padding:25px 10px}.time{font-size:clamp(38px,11vw,60px)}} </style></head><body><main class="shell"><nav class="top"><a href="/">← BOX SIGNAL</a><span>PIXEL WATCH</span></nav><div class="watch"><div class="face"><div class="status">● TIME SIGNAL ACTIVE</div><div class="time" id="time">00:00:00</div><div class="date" id="date">LOADING...</div></div></div><div class="buttons"><button id="pop">↗ POP OUT WATCH</button><button id="back" hidden>↙ BACK TO WEBSITE</button><button id="format">SWITCH 12/24 HOUR</button></div><p class="hint">Pop the watch into a separate movable window. Browser windows cannot always stay above other applications; this depends on your browser and operating system.</p></main><script>
const params=new URLSearchParams(location.search),isPop=params.has('popout');if(isPop){document.body.classList.add('popout');document.getElementById('back').hidden=false;document.title='Floating Pixel Watch · Box Signal';}
let twelve=false;function tick(){const d=new Date();document.getElementById('time').textContent=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:twelve}).format(d);document.getElementById('date').textContent=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'2-digit',month:'short',year:'numeric'}).format(d).toUpperCase()}tick();setInterval(tick,250);
document.getElementById('format').addEventListener('click',()=>{twelve=!twelve;tick()});
document.getElementById('pop').addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('popout','1');const w=window.open(url.href,'boxSignalPixelWatch','popup=yes,width=440,height=330,resizable=yes,scrollbars=yes');if(!w)alert('Your browser blocked the pop-out. Please allow pop-ups for Box Signal and try again.');});
document.getElementById('back').addEventListener('click',()=>{if(window.opener&&!window.opener.closed){window.opener.focus();window.close()}else{location.href=location.pathname}});
</script></body></html>
